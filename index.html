<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Index — A Directory of Startups</title>
  <meta name="description" content="A browsable card catalog of early-stage startups." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ============ HEADER / HERO ============ -->
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="mark">
        <span class="mark-glyph">✦</span>
        <span class="mark-text">The&nbsp;Index</span>
      </div>
      <p class="tagline">A card catalog for startups worth knowing about.</p>
    </div>
    <div class="drawer-lip" aria-hidden="true"></div>
  </header>

  <main class="wrap">

    <!-- ============ SEARCH / FILTER ============ -->
    <section class="catalog-drawer" aria-label="Search startups">
      <label class="drawer-tab" for="search-input">
        <span class="tab-index">No. 01</span>
        <span class="tab-title">Search the drawer</span>
      </label>
      <div class="search-row">
        <input
          type="text"
          id="search-input"
          placeholder="Search by name or description…"
          autocomplete="off"
        />
        <span class="search-count" id="result-count" aria-live="polite">8 cards</span>
      </div>
    </section>

    <!-- ============ STARTUP CARD GRID ============ -->
    <section aria-label="Startup cards">
      <div class="card-grid" id="card-grid">
        <!-- Cards are injected by js/script.js -->
      </div>
      <p class="no-results" id="no-results" hidden>No cards match that search. Try another term.</p>
    </section>

    <!-- ============ SUBMISSION FORM ============ -->
    <section class="submit-section" aria-label="Submit your startup">
      <div class="drawer-tab standalone-tab">
        <span class="tab-index">No. 02</span>
        <span class="tab-title">Add a card to the drawer</span>
      </div>

      <form id="submit-form" class="submit-form" novalidate>
        <div class="field">
          <label for="startup-name">Startup name</label>
          <input type="text" id="startup-name" name="startup-name" required />
        </div>

        <div class="field">
          <label for="startup-url">Website</label>
          <input type="url" id="startup-url" name="startup-url" placeholder="https://" required />
        </div>

        <div class="field">
          <label for="startup-desc">Short description</label>
          <textarea id="startup-desc" name="startup-desc" rows="3" maxlength="140" required></textarea>
          <span class="hint"><span id="char-count">140</span> characters left</span>
        </div>

        <button type="submit" class="submit-btn">File this card</button>

        <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>

  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>The Index — built as a static reference, no server required.</p>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
